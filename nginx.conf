# ─── Nginx config for moneytrend.in (Hostinger VPS) ───
# Place at: /etc/nginx/sites-available/moneytrend.in
# Symlink:  ln -s /etc/nginx/sites-available/moneytrend.in /etc/nginx/sites-enabled/
# Test:     nginx -t
# Reload:   systemctl reload nginx

server {
    listen 80;
    server_name moneytrend.in www.moneytrend.in;

    # Redirect HTTP → HTTPS (after SSL is set up)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name moneytrend.in www.moneytrend.in;

    # ─── SSL (Hostinger auto-generates these, or use certbot) ───
    ssl_certificate     /etc/ssl/certs/moneytrend.in.crt;
    ssl_certificate_key /etc/ssl/private/moneytrend.in.key;

    # ─── Frontend static files ───
    root /var/www/moneytrend.in;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;

    # Cache hashed assets forever (Vite adds content hashes)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ─── API reverse proxy → Node on port 4000 ───
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Allow large file uploads (banners, news images)
        client_max_body_size 20M;
    }

    # ─── Uploaded media files ───
    location /uploads/ {
        proxy_pass http://127.0.0.1:4000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ─── SPA fallback — all other routes → index.html ───
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
